name: Signed release
on:
  push:
    tags:
      - 'v*.*.*'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install SDK
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
      - name: Validate signing configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || { echo "Signing secrets missing"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/obdix-release.jks"
          test -s "$RUNNER_TEMP/obdix-release.jks"
      - name: Test and build signed release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/obdix-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon :app:testReleaseUnitTest :app:assembleRelease
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "OBDIX-${GITHUB_REF_NAME}.apk"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: OBDIX-*.apk
